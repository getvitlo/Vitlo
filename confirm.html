<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Confirm your email</title>
</head>
<body style="margin:0;padding:0;background-color:#080b09;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
 border="0" style="background-color:#080b09;">
<tr>
<td align="center" style="padding:40px 20px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
 border="0" style="max-width:480px;background-color:#0e1512;
 border:1px solid #1e2a24;border-radius:20px;">
<tr>
<td align="center" style="padding:44px 34px 8px;">
<div style="font-family:Georgia,serif;font-size:34px;line-height:1.15;
 color:#ffffff;">Welcome to <span style="color:#5cff9d;">Vitlo</span></div>
</td>
</tr>
<tr>
<td align="center" style="padding:16px 34px 0;">
<div style="font-family:Arial,sans-serif;font-size:15px;line-height:1.65;
 color:#a9b8ae;">Thanks for signing up. Confirm your email address
and your account is ready to use.</div>
</td>
</tr>
<tr>
<td align="center" style="padding:30px 34px 6px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" bgcolor="#2ecc71" style="border-radius:14px;">
<a href="https://getvitlo.github.io/Vitlo/confirm.html?token_hash={{ .TokenHash }}&type=signup"
 style="display:inline-block;padding:16px 38px;
 font-family:Arial,sans-serif;font-size:16px;font-weight:bold;
 color:#07110b;text-decoration:none;border-radius:14px;">
Confirm my email</a>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td align="center" style="padding:26px 34px 0;">
<div style="font-family:Arial,sans-serif;font-size:12.5px;
 line-height:1.6;color:#6d7d73;">This link expires in 24 hours
and can only be used once.</div>
</td>
</tr>
<tr>
<td style="padding:26px 34px 0;">
<div style="height:1px;background-color:#1e2a24;font-size:0;
 line-height:0;">&nbsp;</div>
</td>
</tr>
<tr>
<td style="padding:20px 34px 40px;">
<div style="font-family:Arial,sans-serif;font-size:11.5px;
 line-height:1.6;color:#5d6b62;">Didn't sign up for Vitlo?
Ignore this email and nothing will happen.</div>
</td>
</tr>
</table>
<div style="font-family:Arial,sans-serif;font-size:11px;
 color:#4a564e;margin-top:22px;">Vitlo</div>
</td>
</tr>
</table>
</body>
</html>
