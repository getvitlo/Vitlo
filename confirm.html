<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<meta name="color-scheme" content="dark">
<title>Vitlo · Email confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#080b09}
  body{
    font-family:'Outfit',system-ui,sans-serif;color:#e8efe9;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    position:relative;overflow-x:hidden;
  }
  /* the same two light sources the app uses, so this does not feel like a different product */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(150% 80% at 50% -12%, rgba(44,76,124,.185), rgba(36,62,104,.078) 52%, transparent 88%),
      radial-gradient(118% 64% at 4% 106%, rgba(38,68,112,.10), transparent 84%),
      radial-gradient(88% 52% at 100% 30%, rgba(46,204,113,.034), transparent 80%);
  }
  .card{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
  .mark{
    width:74px;height:74px;border-radius:22px;margin:0 auto 26px;
    background:linear-gradient(165deg,rgba(46,204,113,.16),rgba(46,204,113,.04));
    border:1px solid rgba(46,204,113,.28);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 40px -12px rgba(46,204,113,.5);
    animation:pop .5s cubic-bezier(.22,1.3,.4,1) both;
  }
  .mark svg{width:34px;height:34px;fill:none;stroke:#5cff9d;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s cubic-bezier(.4,0,.2,1) .28s forwards}
  h1{font-family:'Instrument Serif',serif;font-size:38px;line-height:1.08;letter-spacing:-.5px;font-weight:400;
    animation:rise .5s cubic-bezier(.22,1,.36,1) .16s both}
  h1 em{font-style:normal;color:#5cff9d}
  .sub{font-size:15px;line-height:1.6;color:rgba(232,239,233,.62);margin-top:14px;
    animation:rise .5s cubic-bezier(.22,1,.36,1) .24s both}
  .btn{
    display:block;width:100%;margin-top:30px;padding:17px 20px;border:0;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:-.2px;color:#07110b;
    border-radius:17px;background:linear-gradient(180deg,#4ee88c,#25b365);
    box-shadow:0 8px 26px -8px rgba(46,204,113,.6),inset 0 1px 0 rgba(255,255,255,.35);
    text-decoration:none;animation:rise .5s cubic-bezier(.22,1,.36,1) .32s both;transition:transform .14s;
  }
  .btn:active{transform:scale(.985)}
  .note{font-size:12.5px;color:rgba(232,239,233,.4);margin-top:28px;line-height:1.6;
    animation:rise .5s cubic-bezier(.22,1,.36,1) .4s both}
  /* the fallback sits quietly at the bottom: it is for the rare case, not the common one */
  .fb{margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07);
    animation:rise .5s cubic-bezier(.22,1,.36,1) .48s both}
  .fb-l{font-size:11px;font-weight:700;letter-spacing:.8px;color:rgba(232,239,233,.32);text-transform:uppercase}
  .fb-r{display:flex;gap:8px;margin-top:11px}
  .fb-i{flex:1;min-width:0;padding:11px 13px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:rgba(232,239,233,.66);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .fb-b{flex-shrink:0;padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);color:#e8efe9;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .fb-b:active{background:rgba(255,255,255,.1)}
  @keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
    </div>

    <h1>You're <em>in</em>.</h1>
    <p class="sub">Thanks for signing up. Your email is confirmed and your account is ready — open Vitlo and your first scan is waiting.</p>

    <a class="btn" id="openBtn" href="vitlo://auth-callback">Open Vitlo</a>

    <p class="note">Didn't open automatically? Tap the button above.<br>You can close this tab once the app is running.</p>

    <div class="fb">
      <div class="fb-l">If the app didn't open</div>
      <div class="fb-r">
        <div class="fb-i" id="link">vitlo://auth-callback</div>
        <button class="fb-b" id="copy" onclick="copyLink()">Copy</button>
      </div>
    </div>
  </div>

<script>
  // Carry the auth fragment or code straight through to the app, so the deep
  // link arrives with the tokens rather than bare.
  (function(){
    // Supabase hands the tokens over as a hash fragment (implicit) or a code in
    // the query string (PKCE). Either way they go straight through to the app.
    var extra = window.location.hash || (window.location.search || '');
    var target = 'vitlo://auth-callback' + extra;
    var isRecovery = /type=recovery/.test(extra);
    if (isRecovery) {
      document.querySelector('h1').innerHTML = 'Reset <em>ready</em>.';
      document.querySelector('.sub').textContent =
        'Open Vitlo and you can choose a new password.';
    }
    var btn = document.getElementById('openBtn');
    var box = document.getElementById('link');
    btn.href = target;
    box.textContent = target.length > 46 ? target.slice(0, 46) + '…' : target;
    box.dataset.full = target;
    /* One automatic attempt. iOS blocks scheme navigation that is not tied to a
       gesture in some contexts, which is exactly why the button below it is not
       optional decoration. */
    setTimeout(function(){ try { window.location.href = target; } catch (e) {} }, 400);
  })();

  function copyLink(){
    var full = document.getElementById('link').dataset.full;
    var b = document.getElementById('copy');
    navigator.clipboard.writeText(full).then(function(){
      b.textContent = 'Copied';
      setTimeout(function(){ b.textContent = 'Copy'; }, 1800);
    }).catch(function(){
      b.textContent = 'Select it';
    });
  }
</script>
</body>
</html>
